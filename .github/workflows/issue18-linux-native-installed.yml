name: Suite 18 Linux Native Installed Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native-core-066-python-311:
    name: Linux installed Core 0.6.6, ScoreForm, Quillan (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install external PDF prerequisites and wheel builder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdfinfo
          command -v pdftoppm
          python -m pip install 'build>=1,<3'

      - name: Download and authenticate the three exact published wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue18-official-wheels"
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import urlretrieve

          from paper_data_suite.returned_paper_installed_wheels import (
              OFFICIAL_WHEELS,
              verify_official_wheelhouse,
          )

          destination = Path(os.environ["RUNNER_TEMP"]) / "issue18-official-wheels"
          repos = {
              "pds-core": "pds-core",
              "scoreform": "pds-scoreform",
              "quillan": "pds-quillan",
          }
          if len(OFFICIAL_WHEELS) != 3 or set(repos) != {
              item.distribution for item in OFFICIAL_WHEELS
          }:
              raise SystemExit("Unexpected official producer wheel set")
          for item in OFFICIAL_WHEELS:
              url = (
                  "https://github.com/Paper-Data-Suite/"
                  f"{repos[item.distribution]}/releases/download/"
                  f"v{item.version}/{item.filename}"
              )
              urlretrieve(url, destination / item.filename)
          verified = verify_official_wheelhouse(destination)
          if len(verified) != 3:
              raise SystemExit("Published official wheel authentication incomplete")
          print("SUITE18_PR60_LINUX_OFFICIAL_WHEELS_AUTHENTICATED")
          PY

      - name: Build candidate Suite wheel, without release-manifest mutation
        shell: bash
        run: |
          set -euo pipefail
          python -m build --wheel --outdir "$RUNNER_TEMP/issue18-dist"
          test -f "$RUNNER_TEMP/issue18-dist/paper_data_suite-0.1.0-py3-none-any.whl"
          git diff --exit-code -- \
            paper_data_suite/data/release_compatibility_v1.json \
            paper_data_suite/data/release_tooling_v1.json

      - name: Resolve and install only the qualified official producer subset
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/issue18-installed-venv"
          py="$RUNNER_TEMP/issue18-installed-venv/bin/python"
          wheels="$RUNNER_TEMP/issue18-official-wheels"
          "$py" -m pip install \
            "$wheels/pds_core-0.6.6-py3-none-any.whl" \
            "$wheels/scoreform-0.13.0-py3-none-any.whl" \
            "$wheels/quillan-0.10.6-py3-none-any.whl" \
            "$RUNNER_TEMP/issue18-dist/paper_data_suite-0.1.0-py3-none-any.whl" \
            'pypdfium2>=5.13,<6' \
            'zxing-cpp>=2.3,<3'
          "$py" -m pip check
          cd "$RUNNER_TEMP"
          "$py" - <<'PY'
          import importlib
          import importlib.metadata as metadata
          import sys
          from pathlib import Path

          expected = {
              "paper-data-suite": ("0.1.0", "paper_data_suite"),
              "pds-core": ("0.6.6", "pds_core"),
              "scoreform": ("0.13.0", "scoreform"),
              "quillan": ("0.10.6", "quillan"),
          }
          root = Path(sys.prefix).resolve(strict=True)
          for dist, (version, module_name) in expected.items():
              if metadata.version(dist) != version:
                  raise SystemExit("Installed distribution version differs")
              module = importlib.import_module(module_name)
              location = Path(module.__file__).resolve(strict=True)
              if not location.is_relative_to(root):
                  raise SystemExit("Producer import escaped isolated environment")
          print("SUITE18_PR60_LINUX_ISOLATED_INSTALL_VERIFIED")
          PY

      - name: Execute three real Core and producer synthetic acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/issue18-installed-venv/bin/python"
          scripts="$GITHUB_WORKSPACE/scripts"
          wheels="$RUNNER_TEMP/issue18-official-wheels"
          cd "$RUNNER_TEMP"
          "$py" "$scripts/issue18_qualify_official_wheels.py" \
            --wheelhouse "$wheels" --installed
          "$py" - <<'PY'
          import importlib.metadata as metadata
          for dist in ("pypdfium2", "zxing-cpp"):
              print(f"{dist}={metadata.version(dist)}")
          PY
          for script in \
            issue18_real_producer_rehearsal.py \
            issue18_positive_scoreform_rehearsal.py \
            issue18_native_mixed_pdf_rehearsal.py
          do
            root=$("$py" - <<'PY'
          from pathlib import Path
          import tempfile
          parent = Path(tempfile.mkdtemp(prefix="suite18_linux_native_"))
          workspace = parent / "suite18_synthetic_workspace"
          workspace.mkdir()
          print(workspace)
          PY
          )
            "$py" "$scripts/$script" --synthetic-workspace "$root"
          done
          echo "SUITE18_PR60_LINUX_NATIVE_PDF_QR_INSTALLED_ACCEPTED"
          echo "SCOPE: Linux Python 3.11 synthetic only; no physical scanner"

      - name: Verify source-tree and release manifest hygiene
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git diff --check
          residue=$(git status --porcelain=v1 --untracked-files=all)
          if [[ -n "$residue" ]]; then
            printf '%s\n' "$residue"
            exit 1
          fi
          echo "SUITE18_PR60_LINUX_SOURCE_TREE_UNCHANGED"
