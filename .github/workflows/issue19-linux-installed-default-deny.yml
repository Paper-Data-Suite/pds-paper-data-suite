name: Suite 19 Linux Installed Default Deny

on:
  push:
    branches:
      - 19-teacher-home-returned-paper-workflow
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-installed-default-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout current #19 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install native PDF tools and wheel builder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install 'build>=1,<3'

      - name: Download and validate three published official wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g2b-wheels"
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import urlretrieve
          from paper_data_suite.returned_paper_installed_wheels import (
              OFFICIAL_WHEELS, verify_official_wheelhouse,
          )
          root = Path(os.environ["RUNNER_TEMP"]) / "g2b-wheels"
          repos = {
              "pds-core": "pds-core",
              "scoreform": "pds-scoreform",
              "quillan": "pds-quillan",
          }
          assert len(OFFICIAL_WHEELS) == 3
          assert {item.distribution for item in OFFICIAL_WHEELS} == set(repos)
          for item in OFFICIAL_WHEELS:
              urlretrieve(
                  "https://github.com/Paper-Data-Suite/"
                  f"{repos[item.distribution]}/releases/download/"
                  f"v{item.version}/{item.filename}",
                  root / item.filename,
              )
          assert len(verify_official_wheelhouse(root)) == 3
          print("SUITE19_G2B_LINUX_PUBLISHED_WHEEL_HASHES_VERIFIED")
          PY

      - name: Build and install isolated actual suite and producer wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m build --wheel --outdir "$RUNNER_TEMP/g2b-suite"
          test -f "$RUNNER_TEMP/g2b-suite/paper_data_suite-0.1.0-py3-none-any.whl"
          python -m venv "$RUNNER_TEMP/g2b-venv"
          py="$RUNNER_TEMP/g2b-venv/bin/python"
          wh="$RUNNER_TEMP/g2b-wheels"
          "$py" -m pip install \
            "$wh/pds_core-0.6.6-py3-none-any.whl" \
            "$wh/scoreform-0.13.0-py3-none-any.whl" \
            "$wh/quillan-0.10.6-py3-none-any.whl" \
            "$RUNNER_TEMP/g2b-suite/paper_data_suite-0.1.0-py3-none-any.whl" \
            'pypdfium2>=5.13,<6' 'zxing-cpp>=2.3,<3'
          "$py" -m pip check

      - name: Real installed Linux native preview but default-deny dispatch
        shell: bash
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/g2b-venv/bin/python"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$py" \
            "$GITHUB_WORKSPACE/scripts/issue19_g2b_linux_installed_default_deny.py" \
            --wheelhouse "$RUNNER_TEMP/g2b-wheels" \
            --fixture "$GITHUB_WORKSPACE/tests/fixtures/issue19_two_page_synthetic_pds2.pdf"

      - name: Source and manifest hygiene
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "SUITE19_G2B_LINUX_REPOSITORY_UNCHANGED"
