name: Suite 49 ephemeral OS-anchored parent deletion acceptance

on:
  push:
    branches:
      - 49-evergreen-launch-and-supported-composition-upgrades
    paths:
      - native/windows/bootstrap/qualify_sandbox_os_parent_ci.ps1
      - native/windows/bootstrap/sandbox_os_parent_probe.ps1
      - .github/workflows/issue49-sandbox-os-parent-denial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  os-parent-negative-access:
    name: Ephemeral Windows OS-parent DELETE denial
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require positive controls and OS-anchored parent deletion denials
        shell: pwsh
        run: |
          ./native/windows/bootstrap/qualify_sandbox_os_parent_ci.ps1
      - name: Ensure source tree unchanged
        shell: pwsh
        run: |
          git diff --check
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) {
            throw 'OS-anchored disposable acceptance modified source tree.'
          }
