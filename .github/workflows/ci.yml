name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure runner-local paths
        shell: pwsh
        run: |
          $coreDirectory = Join-Path $env:RUNNER_TEMP "core"
          $distDirectory = Join-Path $env:RUNNER_TEMP "dist"
          $ruffCache = Join-Path $env:RUNNER_TEMP "ruff-cache"
          $mypyCache = Join-Path $env:RUNNER_TEMP "mypy-cache"

          New-Item -ItemType Directory -Force -Path $coreDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $distDirectory | Out-Null

          $coreWheel = Join-Path `
            $coreDirectory `
            "pds_core-0.6.0-py3-none-any.whl"

          "PDS_CORE_WHEEL=$coreWheel" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PDS_DIST_DIR=$distDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUFF_CACHE_DIR=$ruffCache" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MYPY_CACHE_DIR=$mypyCache" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download official Core 0.6.0 wheel
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v0.6.0/pds_core-0.6.0-py3-none-any.whl" `
            -OutFile $env:PDS_CORE_WHEEL `
            -ErrorAction Stop

          if (-not (Test-Path -LiteralPath $env:PDS_CORE_WHEEL -PathType Leaf)) {
            throw "Core wheel download did not create $env:PDS_CORE_WHEEL."
          }

      - name: Install Core and development package
        shell: pwsh
        run: |
          python -m pip install "$env:PDS_CORE_WHEEL"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Test
        shell: pwsh
        run: >-
          python -m pytest
          --basetemp "${{ runner.temp }}/pytest"
          -o cache_dir="${{ runner.temp }}/pytest-cache"

      - name: Validate compatibility manifest
        run: python scripts/validate_compatibility_manifest.py

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        shell: pwsh
        run: python -m mypy --cache-dir "$env:MYPY_CACHE_DIR"

      - name: Build distributions
        shell: pwsh
        run: python -m build --outdir "$env:PDS_DIST_DIR"

      - name: Validate distributions
        shell: pwsh
        run: |
          python -m twine check "$env:PDS_DIST_DIR/*"

          $wheels = @(
            Get-ChildItem `
              -LiteralPath $env:PDS_DIST_DIR `
              -Filter "*.whl" `
              -File
          )

          if ($wheels.Count -ne 1) {
            throw "Expected exactly one suite wheel; found $($wheels.Count)."
          }

          $suiteWheel = $wheels[0].FullName

          python scripts/check_package.py "$suiteWheel"
          python scripts/smoke_test_wheel.py `
            "$suiteWheel" `
            "$env:PDS_CORE_WHEEL"

      - name: Verify repository hygiene
        shell: pwsh
        run: |
          git diff --check

          $residue = git status --porcelain --untracked-files=all

          if ($residue) {
            $residue
            throw "Validation left tracked or untracked repository residue."
          }

  release-artifacts:
    runs-on: ubuntu-latest

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure release-audit directory
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "compatibility-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          "PDS_COMPATIBILITY_ARTIFACT_DIR=$artifactDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download exact declared release wheels
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          from urllib.request import urlretrieve

          manifest_path = (
              Path("paper_data_suite")
              / "data"
              / "release_compatibility_v1.json"
          )
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          destination = Path(os.environ["PDS_COMPATIBILITY_ARTIFACT_DIR"])

          for component in manifest["components"]:
              release = component["release"]
              url = (
                  f"https://github.com/{component['repository']}"
                  f"/releases/download/{release['tag']}/{release['wheel']}"
              )
              urlretrieve(url, destination / release["wheel"])

      - name: Authenticate declared release wheels
        shell: pwsh
        run: |
          python scripts/validate_compatibility_manifest.py
          python scripts/verify_compatibility_artifacts.py `
            --artifact-dir "$env:PDS_COMPATIBILITY_ARTIFACT_DIR"

      - name: Verify release-audit repository hygiene
        shell: pwsh
        run: |
          git diff --check

          $residue = git status --porcelain --untracked-files=all

          if ($residue) {
            $residue
            throw "Release-artifact audit left repository residue."
          }
